<!doctype html>
<html lang="en" class="dark">
  <!-- Prevent theme flash (FOUC) -->
  <script>
    (() => {
      try {
        const saved = JSON.parse(
          localStorage.getItem("poyberpaint:settings") || "{}",
        );
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const theme = saved.theme || (prefersDark ? "dark" : "light");
        document.documentElement.classList.toggle("dark", theme === "dark");
      } catch {}
    })();
  </script>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PoyberPaint — A modern paint & drawing web app built with vanilla JS and TailwindCSS."
    />
    <meta name="theme-color" content="#0b0f17" />
    <title>PoyberPaint — Draw. Sketch. Create.</title>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              ink: {
                900: "#0b0f17",
                800: "#111827",
                700: "#1f2937",
                600: "#374151",
              },
              accent: { DEFAULT: "#6366f1", hover: "#4f46e5", soft: "#818cf8" },
            },
            boxShadow: {
              glow: "0 0 0 1px rgba(99,102,241,.35), 0 8px 24px -6px rgba(99,102,241,.45)",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body
    class="min-h-screen text-slate-800 dark:text-slate-200 font-sans antialiased selection:bg-accent/30"
  >
    <!-- Header -->
    <header
      class="max-w-[1400px] mx-auto px-4 sm:px-6 pt-6 pb-3 flex items-center justify-between"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-9 h-9 rounded-xl bg-gradient-to-br from-accent to-fuchsia-500 shadow-glow grid place-items-center"
        >
          <svg
            viewBox="0 0 24 24"
            class="w-5 h-5 text-white"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 19l7-7 3 3-7 7-3-3z" />
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />
            <path d="M2 2l7.586 7.586" />
            <circle cx="11" cy="11" r="2" />
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-semibold tracking-tight">
            PoyberPaint
          </h1>
          <p
            class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 -mt-0.5"
          >
            Draw. Sketch. Create.
          </p>
        </div>
      </div>

      <div class="flex items-center gap-1">
        <!-- Theme toggle -->
        <button
          id="themeToggle"
          title="Toggle theme"
          class="relative w-9 h-9 rounded-xl grid place-items-center text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 transition"
        >
          <!-- Sun -->
          <svg
            id="themeIconSun"
            viewBox="0 0 24 24"
            class="absolute w-5 h-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
          <!-- Moon -->
          <svg
            id="themeIconMoon"
            viewBox="0 0 24 24"
            class="absolute w-5 h-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>

        <!-- GitHub -->
        <a
          href="https://github.com/ashkanpoyber"
          target="_blank"
          rel="noopener"
          class="w-9 h-9 rounded-xl grid place-items-center text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 transition"
        >
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="currentColor">
            <path
              d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.36-3.88-1.36-.53-1.34-1.3-1.7-1.3-1.7-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.56-.3-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.2-3.1-.12-.3-.52-1.48.11-3.08 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.6.23 2.78.11 3.08.75.81 1.2 1.84 1.2 3.1 0 4.43-2.7 5.39-5.27 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.2.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"
            />
          </svg>
        </a>
      </div>
    </header>

    <!-- Main -->
    <main class="max-w-[1400px] mx-auto px-4 sm:px-6 pb-6">
      <div class="grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-4">
        <!-- Tools Board -->
        <aside
          class="bg-white/70 dark:bg-ink-800/70 backdrop-blur border border-black/5 dark:border-white/5 rounded-2xl p-3 sm:p-4 shadow-xl lg:sticky lg:top-4 lg:self-start"
        >
          <!-- Shapes -->
          <section class="mb-5">
            <h2
              class="text-[11px] uppercase tracking-widest text-slate-500 font-medium mb-2 px-1"
            >
              Shapes
            </h2>
            <div class="grid grid-cols-3 lg:grid-cols-3 gap-1.5">
              <button
                data-tool="rectangle"
                class="tool-btn group flex flex-col items-center gap-1 py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-slate-200 transition"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="3" y="5" width="18" height="14" rx="1.5" />
                </svg>
                <span class="text-[10px]">Rect</span>
              </button>
              <button
                data-tool="circle"
                class="tool-btn group flex flex-col items-center gap-1 py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-slate-200 transition"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="9" />
                </svg>
                <span class="text-[10px]">Circle</span>
              </button>
              <button
                data-tool="triangle"
                class="tool-btn group flex flex-col items-center gap-1 py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-slate-200 transition"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                >
                  <path d="M12 4l9 16H3z" />
                </svg>
                <span class="text-[10px]">Tri</span>
              </button>

              <!-- 👇 جدید: Line -->
              <button
                data-tool="line"
                class="tool-btn group flex flex-col items-center gap-1 py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-slate-200 transition"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="M5 19L19 5" />
                </svg>
                <span class="text-[10px]">Line</span>
              </button>

              <!-- 👇 جدید: Arrow -->
              <button
                data-tool="arrow"
                class="tool-btn group flex flex-col items-center gap-1 py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-slate-200 transition"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M5 19L19 5" />
                  <path d="M12 5h7v7" />
                </svg>
                <span class="text-[10px]">Arrow</span>
              </button>

              <!-- Fill (بدون تغییر) -->
              <label
                class="flex flex-col items-center gap-1 py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-slate-200 transition cursor-pointer"
              >
                <input type="checkbox" id="fillColor" class="sr-only peer" />
                <svg
                  viewBox="0 0 24 24"
                  class="w-5 h-5 peer-checked:text-accent-soft"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M4 20h16" />
                  <path d="M7 16l7-7 3 3-7 7H7z" />
                  <path d="M14 9l2-2a2 2 0 0 1 3 3l-2 2" />
                </svg>
                <span class="text-[10px] peer-checked:text-accent-soft"
                  >Fill</span
                >
              </label>
            </div>
          </section>

          <!-- Options -->
          <section class="mb-5">
            <h2
              class="text-[11px] uppercase tracking-widest text-slate-500 font-medium mb-2 px-1"
            >
              Options
            </h2>
            <div class="grid grid-cols-4 lg:grid-cols-2 gap-1.5 mb-3">
              <button
                data-tool="brush"
                class="tool-btn active group flex flex-col items-center gap-1 py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-slate-200 transition"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                >
                  <path d="M3 21l3.5-3.5" />
                  <path d="M14 7l3 3L9.5 17.5 6.5 14.5 14 7z" />
                  <path
                    d="M20 4l-3 3 3 3 3-3-3-3z"
                    transform="translate(-3,-1) scale(.9)"
                  />
                </svg>
                <span class="text-[10px]">Brush</span>
              </button>
              <button
                data-tool="eraser"
                class="tool-btn group flex flex-col items-center gap-1 py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-slate-200 transition"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                >
                  <path d="M4 17l7-7 6 6-3 3H6l-2-2z" />
                  <path d="M11 10l6-6 6 6-6 6" />
                  <path d="M20 20h-4" />
                </svg>
                <span class="text-[10px]">Eraser</span>
              </button>

              <!-- 👇 جدید: Fill -->
              <button
                data-tool="fill"
                class="tool-btn group flex flex-col items-center gap-1 py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-slate-200 transition"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 12l7-7 8 8-7 7-8-8z" />
                  <path d="M14 5l3-3 4 4-3 3" />
                  <path d="M5 19c-1 0-2 1-2 2 0 0 3 0 3-2z" />
                </svg>
                <span class="text-[10px]">Fill</span>
              </button>

              <!-- Text (بدون تغییر) -->
              <button
                data-tool="text"
                class="tool-btn group flex flex-col items-center gap-1 py-2.5 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/5 hover:text-slate-800 dark:hover:text-slate-200 transition"
              >
                <svg
                  viewBox="0 0 24 24"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 7V5h16v2" />
                  <path d="M12 5v14" />
                  <path d="M9 19h6" />
                </svg>
                <span class="text-[10px]">Text</span>
              </button>
            </div>

            <!-- Background upload -->
            <label
              class="mt-2 flex items-center justify-center gap-2 py-2 rounded-xl text-xs font-medium text-slate-500 dark:text-slate-400 bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 cursor-pointer transition"
            >
              <svg
                viewBox="0 0 24 24"
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="9" cy="9" r="2" />
                <path d="M21 15l-5-5L5 21" />
              </svg>
              <span>Background Image</span>
              <input
                type="file"
                id="bgUpload"
                accept="image/*"
                class="sr-only"
              />
            </label>

            <!-- Clear background (فقط وقتی عکس هست نشون داده میشه) -->
            <button
              id="clearBg"
              class="mt-1.5 hidden w-full flex items-center justify-center gap-2 py-1.5 rounded-xl text-xs font-medium text-rose-400 bg-rose-500/5 hover:bg-rose-500/15 transition"
            >
              <svg
                viewBox="0 0 24 24"
                class="w-3.5 h-3.5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path d="M18 6L6 18M6 6l12 12" />
              </svg>
              Remove Background
            </button>

            <div class="px-1">
              <div class="flex items-center justify-between mb-1.5">
                <span class="text-[11px] text-slate-500 dark:text-slate-400"
                  >Size</span
                >
                <span
                  id="sizeLabel"
                  class="text-[11px] font-medium text-accent-soft"
                  >5px</span
                >
              </div>
              <input
                id="sizeSlider"
                type="range"
                min="1"
                max="60"
                value="5"
                class="w-full h-1.5 bg-black/10 dark:bg-white/10 rounded-lg appearance-none cursor-pointer"
              />
            </div>
          </section>

          <!-- Colors -->
          <section class="mb-5">
            <h2
              class="text-[11px] uppercase tracking-widest text-slate-500 font-medium mb-2 px-1"
            >
              Colors
            </h2>
            <div id="colorRow" class="grid grid-cols-6 gap-2 px-1"></div>
          </section>

          <!-- Actions -->
          <section class="grid grid-cols-2 gap-2 pt-3 border-t border-white/5">
            <button
              id="undo"
              title="Undo (Ctrl+Z)"
              class="flex items-center justify-center gap-1.5 py-2 rounded-xl text-xs font-medium text-slate-300 bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 transition disabled:opacity-40"
            >
              <svg
                viewBox="0 0 24 24"
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 14L4 9l5-5" />
                <path d="M4 9h10a6 6 0 0 1 6 6v1" />
              </svg>
              Undo
            </button>
            <button
              id="redo"
              title="Redo (Ctrl+Y)"
              class="flex items-center justify-center gap-1.5 py-2 rounded-xl text-xs font-medium text-slate-300 bg-black/5 dark:bg-white/5 hover:bg-black/10 dark:hover:bg-white/10 transition disabled:opacity-40"
            >
              <svg
                viewBox="0 0 24 24"
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M15 14l5-5-5-5" />
                <path d="M20 9H10a6 6 0 0 0-6 6v1" />
              </svg>
              Redo
            </button>
            <button
              id="clear"
              class="flex items-center justify-center gap-1.5 py-2 rounded-xl text-xs font-medium text-slate-300 bg-white/5 hover:bg-rose-500/20 hover:text-rose-200 transition"
            >
              <svg
                viewBox="0 0 24 24"
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path d="M3 6h18" />
                <path d="M8 6V4h8v2" />
                <path d="M6 6l1 14h10l1-14" />
              </svg>
              Clear
            </button>
            <button
              id="save"
              class="flex items-center justify-center gap-1.5 py-2 rounded-xl text-xs font-semibold text-white bg-accent hover:bg-accent-hover shadow-glow transition"
            >
              <svg
                viewBox="0 0 24 24"
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <path d="M7 10l5 5 5-5" />
                <path d="M12 15V3" />
              </svg>
              Save
            </button>
            <button
              id="reset"
              title="Reset saved data"
              class="col-span-2 flex items-center justify-center gap-1.5 py-2 rounded-xl text-xs font-medium text-slate-500 dark:text-slate-400 bg-white/5 hover:bg-amber-500/20 hover:text-amber-200 transition"
            >
              <svg
                viewBox="0 0 24 24"
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                <path d="M3 3v5h5" />
              </svg>
              Reset Saved Data
            </button>
          </section>
        </aside>

        <!-- Canvas Board -->
        <section
          class="bg-white/70 dark:bg-ink-800/70 backdrop-blur border border-black/5 dark:border-white/5 rounded-2xl p-2 sm:p-3 shadow-xl"
        >
          <div class="flex items-center justify-between px-2 pb-2">
            <span class="text-[11px] text-slate-500">Canvas</span>
            <span
              id="saveIndicator"
              class="text-[11px] text-emerald-400 opacity-0 transition-opacity duration-300"
            >
              ✓ Saved
            </span>
          </div>
          <div
            id="canvasWrapper"
            class="relative rounded-xl overflow-hidden bg-white"
          >
            <!-- Background Image Layer (Behind Canvas) -->
            <img
              id="bgLayer"
              class="absolute inset-0 w-full h-full object-cover pointer-events-none hidden"
              alt=""
            />
            <!-- Canvas (Drawing Layer) -->
            <canvas
              id="board"
              class="relative block w-full h-[60vh] sm:h-[72vh]"
            ></canvas>
          </div>
        </section>
      </div>

      <p class="text-center text-[11px] text-slate-500 mt-4">
        Shortcuts:
        <kbd
          class="px-1.5 py-0.5 rounded bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10"
          >Ctrl+Z</kbd
        >
        undo ·
        <kbd
          class="px-1.5 py-0.5 rounded bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10"
          >Ctrl+Y</kbd
        >
        redo ·
        <kbd
          class="px-1.5 py-0.5 rounded bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10"
          >Ctrl+S</kbd
        >
        save
      </p>
      <p
        class="text-center text-[10px] text-slate-400 dark:text-slate-500 mt-1"
      >
        Tip: Load a background image to trace over, or keep it clean to draw
        freely.
      </p>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
